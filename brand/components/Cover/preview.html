<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap">
<style>
  html, body { margin: 0; background: var(--surface); }
  .cover { position: relative; width: 960px; height: 320px; overflow: hidden; background: var(--surface); }
  svg { position: absolute; left: 0; top: 0; }
  .crimson { fill: var(--crimson); }
  .deep { fill: var(--crimson-700); }
  .ink { fill: var(--text); }
  .tint { fill: var(--crimson-100); }
  .key { fill: var(--surface); }
  .text { position: absolute; left: var(--page-margin); top: 150px; max-width: 840px; }
  .name { margin: 0; font-family: var(--font-sans); font-weight: 700; font-size: 64px; line-height: 0.95; color: var(--text); letter-spacing: -0.005em; }
  .tagline { margin: 19px 0 0; font-family: var(--font-sans); font-weight: 300; font-size: 14px; line-height: 1.3; color: var(--text-secondary); }
</style>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="cover">
  <!--
    blocks: crimson 540×112, text (ink | white) 160×112, crimson-700 100×112, crimson-100 160×112 — a strip of unequal bands across the top
    arrangement: top-band skeleton (name too wide for the 440px zone), bands flush, bleeding off top, left and right
    pattern: literal motif, the symbol itself — a notched panel — repeated as a row cut out of the crimson slab in surface, like ribbons on a shelf
    scales: unit width 30 (gap-tight×2), pitch 57 (3×gap), notch and height in the symbol's own 832:1007:224 proportions
  -->
  <svg width="960" height="112" viewBox="0 0 960 112" aria-hidden="true">
    <defs><path id="rib" d="M0 0 L15.0 8.1 L30 0 L30 36.3 L0 36.3 Z"/></defs>
    <rect class="crimson" x="0" y="0" width="540" height="112"/>
    <rect class="ink" x="540" y="0" width="160" height="112"/>
    <rect class="deep" x="700" y="0" width="100" height="112"/>
    <rect class="tint" x="800" y="0" width="160" height="112"/>
    <g class="key"><use href="#rib" x="19" y="38"/><use href="#rib" x="76" y="38"/><use href="#rib" x="133" y="38"/><use href="#rib" x="190" y="38"/><use href="#rib" x="247" y="38"/><use href="#rib" x="304" y="38"/><use href="#rib" x="361" y="38"/><use href="#rib" x="418" y="38"/><use href="#rib" x="475" y="38"/></g>
  </svg>
  <div class="text">
    <p class="name">AUIB Society of<br>Arts and Letters</p>
    <p class="tagline">A society of people who write things down.</p>
  </div>
</div>
</body>
</html>
