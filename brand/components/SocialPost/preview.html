<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&family=Ubuntu+Mono&display=swap">
<style>
  body { margin: 0; padding: 19px; background: var(--surface); }
  .row { display: flex; gap: 19px; }
  .row > .sal-post { width: 300px; }
  .sal-post--white .sal-post__frame { outline: var(--hairline) solid var(--rule); }
</style>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">

<body>
<div class="row">
  <div class="sal-post sal-post--crimson">
    <div class="sal-post__frame">
      <p class="sal-post__name">Society of<br>Arts and Letters</p>
      <img class="sal-post__symbol" src="../../assets/Logos/sal-symbol-white.svg" alt="">
      <h2 class="sal-post__headline">The Open Call.</h2>
      <p class="sal-post__meta"><span>Tuesday, October 13, 4:00 PM</span><span>@auibsal</span></p>
      <p class="sal-post__ar sal-ar" lang="ar">الدعوة مفتوحة</p>
    </div>
  </div>
  <div class="sal-post sal-post--ink">
    <div class="sal-post__frame">
      <p class="sal-post__name">Society of<br>Arts and Letters</p>

      <p class="sal-post__meta"><span>Sunday, October 18, 6:00 PM</span><span>@auibsal</span></p>

  </div>
  <div class="sal-post sal-post--white">
    <div class="sal-post__frame">

      <img class="sal-post__symbol" src="../../assets/Logos/sal-symbol.svg" alt="">
      <h2 class="sal-post__headline">Become a member.</h2>
      <p class="sal-post__meta"><span>Until Thursday, October 22</span><span>@auibsal</span></p>
      <p class="sal-post__ar sal-ar" lang="ar">كن عضواً</p>
    </div>
  </div>

</html>
