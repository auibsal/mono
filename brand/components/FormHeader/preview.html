<!-- @dsCard group="Documents" height=400 subtitle="Header, fields and office-use strip" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&family=Ubuntu+Mono&display=swap">
<style>body { margin: 0; padding: 24px 40px; background: var(--surface); }</style>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<section class="sal-form" data-theme="light" style="max-width: 636px">
  <header class="sal-form__head">
    <div>
      <span class="sal-form__code">SAL-OPS-02 · F-14</span>
      <h2 class="sal-form__title">Event Proposal</h2>
    </div>
    <img class="sal-form__symbol" src="../../assets/Logos/sal-symbol.svg" alt="Society of Arts and Letters">
  </header>
  <div class="sal-form__fields">
    <label class="sal-form__field sal-form__field--wide"><span class="sal-label">Event title</span><span class="sal-writeon"></span></label>
    <label class="sal-form__field"><span class="sal-label">Proposed by</span><span class="sal-writeon"></span></label>
    <label class="sal-form__field"><span class="sal-label">Date</span><span class="sal-writeon"></span></label>
    <label class="sal-form__field"><span class="sal-label">Room</span><span class="sal-writeon"></span></label>
    <label class="sal-form__field"><span class="sal-label">Budget (IQD)</span><span class="sal-writeon"></span></label>
  </div>
  <div class="sal-form__office">
    <span class="sal-label">For office use</span>
    <label><span class="sal-label">Received</span><span class="sal-writeon"></span></label>
    <label><span class="sal-label">Approved by</span><span class="sal-writeon"></span></label>
    <label><span class="sal-label">Ref.</span><span class="sal-writeon"></span></label>
  </div>
</section>
</body>
</html>
