# Template-only checks. `bun run init` deletes this workflow in new projects.
name: Template

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SKIP_ENV_VALIDATION: "true"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  init:
    name: Init (${{ matrix.modules == '' && 'no optional modules' || 'all modules' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        modules: ["", "all"]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:template
      - name: Initialize a project from the template
        run: >
          bun scripts/init.ts --yes
          --org-name "شركة ٩٦٤"
          --org-slug acme
          --project-name "Acme"
          --project-url https://acme.example.iq
          --commerce digital
          --keep-modules "${{ matrix.modules }}"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check
